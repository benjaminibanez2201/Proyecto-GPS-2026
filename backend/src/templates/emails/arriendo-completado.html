<div
  style="
    margin: 0;
    padding: 0;
    background-color: #fdfefe;
    font-family: Arial, Helvetica, sans-serif;
  "
>
  <div style="max-width: 600px; margin: 0 auto; padding: 24px">
    <div
      style="
        background: #ffffff;
        border: 1px solid #e6e8ef;
        border-radius: 10px;
        overflow: hidden;
      "
    >
      <div style="padding: 18px 24px; background: #008080; color: #ffffff">
        <img
          src="cid:arriendu-banner"
          alt="ArriendU"
          style="
            display: block;
            max-width: 220px;
            width: 100%;
            height: auto;
            margin: 0 0 10px;
          "
        />
        <p style="margin: 6px 0 0; font-size: 13px; opacity: 0.95">
          Arriendo confirmado
        </p>
      </div>
      <div style="padding: 24px; color: #111827">
        <p style="margin: 0 0 12px; font-size: 14px; line-height: 1.6">
          Hola {{nombre}},
        </p>
        <p style="margin: 0 0 12px; font-size: 14px; line-height: 1.6">
          Tu arriendo con {{otroNombre}} ha sido confirmado por ambas partes.
        </p>
        <div style="text-align: center; margin: 22px 0">
          <a
            href="{{rentalUrl}}"
            style="
              display: inline-block;
              padding: 12px 18px;
              border-radius: 8px;
              background: #008080;
              color: #ffffff;
              text-decoration: none;
              font-weight: 700;
              font-size: 14px;
            "
            >Ver arriendo</a
          >
        </div>
        <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #6b7280">
          Este es un mensaje automático, por favor no respondas.
        </p>
      </div>
      <div
        style="
          padding: 16px 24px;
          background: #fdfefe;
          border-top: 1px solid #e6e8ef;
          color: #6b7280;
          font-size: 12px;
          line-height: 1.5;
        "
      >
        <p style="margin: 0">Gracias por usar ArriendU</p>
      </div>
    </div>
  </div>
</div>
